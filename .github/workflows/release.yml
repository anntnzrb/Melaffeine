name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Release Apple Silicon Binaries
    runs-on: macos-14
    timeout-minutes: 15
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine Monotonic Version
        run: |
          VERSION="0.1.${{ github.run_number }}"
          TAG_NAME="v${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "Release version: ${TAG_NAME} (${VERSION})"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Stamp Release Version in Metadata
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Resources/Info.plist
          sed -i '' -E '/^\[workspace.package\]$/,/^\[/ s/^version = ".*"$/version = "'"${VERSION}"'"/' Cargo.toml
          nix develop -c cargo metadata --format-version 1 >/dev/null

      - name: Build Melaffeine.app and CLI via Nix
        run: |
          nix build .#default --out-link result-app
          nix build .#cli --out-link result-cli

          mkdir -p release-artifacts staging
          # Stage bundle and CLI binary for zip distribution
          cp -R result-app/Applications/Melaffeine.app staging/
          cp result-cli/bin/melaffeine staging/melaffeine
          chmod -R u+w staging
          codesign --force --sign - staging/Melaffeine.app
          codesign --force --sign - staging/melaffeine
          ditto -c -k staging release-artifacts/Melaffeine-aarch64-apple-darwin.zip

          # Copy standalone CLI binary
          cp staging/melaffeine release-artifacts/melaffeine-cli-aarch64-apple-darwin
          test "$(release-artifacts/melaffeine-cli-aarch64-apple-darwin --version)" = "melaffeine ${VERSION}"

          # Compute Checksums
          cd release-artifacts
          shasum -a 256 Melaffeine-aarch64-apple-darwin.zip > checksums.txt
          shasum -a 256 melaffeine-cli-aarch64-apple-darwin >> checksums.txt
          APP_SHA=$(shasum -a 256 Melaffeine-aarch64-apple-darwin.zip | awk '{print $1}')
          echo "APP_SHA=${APP_SHA}" >> $GITHUB_ENV
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: Melaffeine ${{ env.TAG_NAME }}
          files: |
            release-artifacts/Melaffeine-aarch64-apple-darwin.zip
            release-artifacts/melaffeine-cli-aarch64-apple-darwin
            release-artifacts/checksums.txt
          generate_release_notes: true
          make_latest: true

      - name: Update Homebrew Tap
        uses: actions/checkout@v7
        with:
          repository: 'anntnzrb/homebrew-tap'
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: 'homebrew-tap'

      - name: Commit & Push Updated Cask to Tap
        run: |
          cd homebrew-tap
          mkdir -p Casks

          cat << 'EOF' > Casks/melaffeine.rb
          cask "melaffeine" do
            version "${{ env.VERSION }}"
            sha256 "${{ env.APP_SHA }}"

            url "https://github.com/anntnzrb/Melaffeine/releases/download/v#{version}/Melaffeine-aarch64-apple-darwin.zip"
            name "Melaffeine"
            desc "Tiny native macOS menu-bar utility to prevent sleep"
            homepage "https://github.com/anntnzrb/Melaffeine"

            depends_on macos: :sonoma
            depends_on arch: :arm64
            app "Melaffeine.app"
            binary "melaffeine"

            postflight_steps do
              run "/usr/bin/xattr",
                  args:         ["-dr", "com.apple.quarantine", "{{appdir}}/Melaffeine.app"],
                  must_succeed: false
              run "/usr/bin/xattr",
                  args:         ["-d", "com.apple.quarantine", "{{staged_path}}/melaffeine"],
                  must_succeed: false
            end

            zap trash: [
              "~/Library/Caches/Melaffeine",
              "~/Library/Preferences/Melaffeine.plist",
            ]
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/melaffeine.rb
          if git diff --staged --quiet; then
            echo "No changes in Cask formula."
          else
            git commit -m "melaffeine: bump to ${{ env.TAG_NAME }}"
            git push origin main
          fi
